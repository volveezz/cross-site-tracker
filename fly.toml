# fly.toml app configuration file generated for cross-site-tracker on 2026-01-06T08:06:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cross-site-tracker'
primary_region = 'fra'

[env]
  TRACKER_URL = "https://cross-site-tracker.vercel.app"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
